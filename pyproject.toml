[project]
name = "personal-finance"
version = "0.1.0"
description = "Personal finance tools including quarterly estimated tax calculator (IRS 1040-ES)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.25.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["estimated_tax_calculator.py", "pdf_sanitizer.py"]

[project.scripts]
estimated-tax = "estimated_tax_calculator:main"
pdf-sanitizer = "pdf_sanitizer:main"
